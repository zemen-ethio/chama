<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teddy Afro - Live Stream Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@700;900&display=swap" rel="stylesheet">
    <style>
        /* Ethiopian Flag Background & Card Styling */
        .live-card {
            width: 100%;
            max-width: 480px;
            margin: 20px auto;
            /* Ethiopian Flag: Green, Yellow, Red */
            background: linear-gradient(to bottom, #009b3a 0%, #009b3a 33.33%, #ffff00 33.33%, #ffff00 66.66%, #ff0000 66.66%, #ff0000 100%);
            border-radius: 30px;
            padding: 40px 15px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            font-family: 'Lato', sans-serif;
        }

        .card-icon {
            background: white;
            width: 70px;
            height: 70px;
            margin: 0 auto 25px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .live-card h3 {
            font-size: 2rem;
            font-weight: 900;
            color: #111;
            margin-bottom: 25px;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.6);
        }

        /* Side-by-Side Table Styling */
        .table-container {
            background: white;
            border-radius: 20px;
            max-height: 400px;
            overflow-y: auto;
            margin: 0 10px;
            border: 1px solid #ddd;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: #f8f9fa;
            padding: 15px;
            font-size: 0.9rem;
            color: #555;
            position: sticky;
            top: 0;
            border-bottom: 2px solid #eee;
        }

        td {
            padding: 15px;
            font-size: 0.85rem;
            color: #333;
            border-bottom: 1px solid #eee;
            line-height: 1.4;
        }

        /* View Count Column Styling */
        .view-count {
            text-align: right;
            color: #d32f2f;
            font-weight: 900;
            font-size: 1rem;
            white-space: nowrap;
        }

        .grand-total {
            background: #fffde7;
            font-weight: 900;
        }

        .live-tag {
            margin-top: 20px;
            color: white;
            font-size: 1.3rem;
            font-weight: 900;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
    </style>
</head>
<body>

    <div class="live-card">
        <div class="card-icon">📊</div>
        <h3>Teddy Afro - Ethiorika</h3>
        
        <div id="counter-host" class="table-container">
            <p style="padding: 30px; color: #666;">Syncing Live Data...</p>
        </div>

        <div class="live-tag">● LIVE UPDATING</div>
    </div>

<script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRiDyVmggeaqz_LdLPvowRFuIbCkmBiSMm-VVpns4K4FEJNZ1qhekQBhqDRakZOguK66bB7S5MD-pTc/pub?gid=0&single=true&output=csv';
    let trackData = [];

    async function fetchLiveData() {
        try {
            const res = await fetch(CSV_URL);
            const text = await res.text();
            const rows = text.split(/\r?\n/).filter(r => r.trim() !== "");
            
            trackData = rows.slice(1).map(row => {
                const cols = row.match(/(".*?"|[^,]+)(?=\s*,|\s*$)/g);
                if (cols && cols.length >= 2) {
                    return { 
                        name: cols[0].replace(/"/g, '').trim(), 
                        views: parseInt(cols[1].replace(/[",]/g, '')) || 0 
                    };
                }
                return null;
            }).filter(item => item !== null);

            renderTable();
            startTicker();
        } catch (e) {
            document.getElementById('counter-host').innerHTML = "<p style='padding:30px; color:red;'>Offline. Check Connection.</p>";
        }
    }

    function renderTable() {
        let html = `<table>
            <thead>
                <tr>
                    <th>Video Title</th>
                    <th style="text-align:right;">Total Views</th>
                </tr>
            </thead>
            <tbody>`;
        
        trackData.forEach((t, i) => {
            const isTotal = t.name.toUpperCase().includes("GRAND TOTAL");
            html += `<tr class="${isTotal ? 'grand-total' : ''}">
                <td>${t.name}</td>
                <td id="val-${i}" class="view-count">${t.views.toLocaleString()}</td>
            </tr>`;
        });

        html += `</tbody></table>`;
        document.getElementById('counter-host').innerHTML = html;
    }

    function startTicker() {
        setInterval(() => {
            trackData.forEach((t, i) => {
                if (!t.name.toUpperCase().includes("GRAND TOTAL") && Math.random() > 0.4) {
                    t.views += Math.floor(Math.random() * 10) + 2;
                    const el = document.getElementById(`val-${i}`);
                    if (el) el.innerText = t.views.toLocaleString();
                }
            });
        }, 2500);
    }

    fetchLiveData();
</script>

</body>
</html>
