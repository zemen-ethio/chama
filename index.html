<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="description" content="Rikash Gebeya - Your trusted store in Addis Ababa, Ethiopia">
    <title>Rikash Gebeya | Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* CORE THEME */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --fb-blue: #1877f2;
            --fb-blue-dark: #1464c7;
            --fb-blue-darker: #0e5fd1;
            --sapphire-blue: #0f52ba;
            --pure-white: #ffffff;
            --white-transparent: rgba(255, 255, 255, 0.15);
        }

        body {
            font-family: 'Lato', sans-serif;
            background-color: var(--fb-blue);
            color: var(--pure-white);
            line-height: 1.4;
            overflow-x: hidden;
        }

        /* Ticker Banner */
        .ticker-wrapper { background-color: var(--fb-blue-darker); overflow: hidden; padding: 10px 0; border-bottom: 1px solid var(--white-transparent); }
        .ticker-content { display: inline-block; animation: scrollTicker 30s linear infinite; white-space: nowrap; }
        .ticker-item { display: inline-block; margin: 0 25px; font-size: 0.9rem; font-weight: 500; }
        @keyframes scrollTicker { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        /* Header */
        .header { background-color: var(--fb-blue-dark); position: sticky; top: 0; z-index: 1000; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        .header-container { max-width: 1200px; margin: 0 auto; padding: 0.8rem 2rem; display: flex; align-items: center; justify-content: space-between; }
        .nav-menu { display: flex; list-style: none; gap: 5px; }
        .nav-menu li a { padding: 8px 15px; text-decoration: none; color: white; border-radius: 6px; font-size: 0.9rem; }
        .nav-menu li.active a { background-color: var(--white-transparent); }

        /* HERO SECTION */
        .page-content { max-width: 1300px; margin: 0 auto; padding: 1.5rem; }
        .hero-section {
            display: flex;
            flex-wrap: wrap;
            background-color: var(--fb-blue-dark);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        /* LARGE IMAGE (65% width) */
        .hero-image { flex: 2; min-width: 320px; }
        .hero-image img { width: 100%; height: 100%; object-fit: cover; display: block; }

        /* CONTENT AREA (35% width) */
        .hero-content { 
            flex: 1.2; 
            padding: 1.5rem; 
            background-color: var(--fb-blue); 
            display: flex; 
            flex-direction: row; 
            gap: 20px; 
            min-width: 300px; 
        }

        /* ADDRESS (Left side) */
        .address-info { flex: 1; font-size: 0.8rem; }
        .address-info h2 { font-size: 1.2rem; margin-bottom: 8px; }
        .divider { height: 1px; background: var(--white-transparent); margin: 8px 0; }

        /* SAPPHIRE BLUE TRACKER (Right side) */
        .tracker-container { flex: 1.2; background: rgba(0,0,0,0.2); padding: 8px; border-radius: 8px; max-width: 280px; }
        .table-wrap { background: var(--sapphire-blue); border-radius: 6px; overflow: hidden; border: 1px solid var(--white-transparent); }
        table { width: 100%; border-collapse: collapse; font-size: 0.65rem; color: var(--pure-white); }
        td { padding: 10px 8px; font-weight: 700; border-bottom: 1px solid rgba(255,255,255,0.1); vertical-align: middle; }

        /* Row Styles */
        .tracker-row { background-color: var(--sapphire-blue); }
        .row-total { background: #000000 !important; color: #ffffff !important; border-top: 2px solid var(--white-transparent); font-weight: 900; }
        .view-val { text-align: right; font-family: monospace; font-size: 0.75rem; }

        .live-label { text-align: center; margin-top: 8px; font-size: 0.6rem; font-weight: 900; color: white; animation: blink 2s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        @media (max-width: 1024px) { .hero-content { flex-direction: column; } .tracker-container { max-width: 100%; } }
        @media (max-width: 768px) { .hero-section { flex-direction: column; } .hero-image { height: 300px; } }
    </style>
</head>
<body>

<div class="ticker-wrapper">
    <div class="ticker-content">
        <span class="ticker-item">✨ ከ10,000 ብር በላይ ለሚሆኑ ትዕዛዞች ነፃ ማጓጓዣ ✨</span>
        <span class="ticker-item">🔥 በየሳምንቱ አዳዲስ ምርቶች🔥</span>
        <span class="ticker-item">🚚 በመላው ኢትዮጵያ ፈጣን አገልግሎት 🚚</span>
    </div>
</div>

<header class="header">
    <div class="header-container">
        <div class="brand">
            <img src="img-logo.webp" alt="Logo" style="height: 40px; width: auto;">
            <span style="font-size: 1.1rem; font-weight: 700; margin-left: 8px;">Rikash Gebeya</span>
        </div>
        <ul class="nav-menu">
            <li class="active"><a href="index.html">Home</a></li>
            <li><a href="shop.html">Shop</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </div>
</header>

<main class="page-content">
    <div class="hero-section">
        <div class="hero-image">
            <img src="img-home.webp" alt="Rikash Gebeya Main">
        </div>

        <div class="hero-content">
            <div class="address-info">
                <h2>Address</h2>
                <p>Djibouti street, Town Square Mall<br>Addis Ababa, Ethiopia</p>
                <div class="divider"></div>
                <p><strong>Hours:</strong> Mon-Fri 9am-6pm</p>
                <p><strong>Tel:</strong> 0972919293</p>
            </div>

            <div class="tracker-container">
                <div class="table-wrap" id="live-data-box">
                    <p style="padding: 20px; text-align: center; color: white;">Synchronizing Live Data...</p>
                </div>
                <div class="live-label">● TEDDY AFRO LIVE VIEW COUNT</div>
            </div>
        </div>
    </div>
</main>

<script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRiDyVmggeaqz_LdLPowRFuIbCkmBiSMm-VVpns4K4FEJNZ1qhekQBhqDRakZOguK66bB7S5MD-pTc/pub?gid=0&single=true&output=csv';
    let localData = [];

    async function initializeTracker() {
        try {
            const response = await fetch(CSV_URL);
            const text = await response.text();
            const rows = text.split(/\r?\n/).filter(r => r.trim() !== "");
            
            localData = rows.slice(1).map(row => {
                const parts = row.match(/(".*?"|[^,]+)(?=\s*,|\s*$)/g);
                if (parts && parts.length >= 2) {
                    return { 
                        name: parts[0].replace(/"/g, '').trim(), 
                        views: parseInt(parts[1].replace(/[",]/g, '')) || 0 
                    };
                }
                return null;
            }).filter(d => d !== null);

            drawTracker();
            setInterval(tickViews, 2500);
        } catch (e) {
            document.getElementById('live-data-box').innerHTML = "<p style='padding:15px; text-align:center;'>Feed Unavailable</p>";
        }
    }

    function drawTracker() {
        let tableMarkup = `<table><tbody>`;
        localData.forEach((item, i) => {
            const isTotal = item.name.toUpperCase().includes("GRAND TOTAL");
            const rowClass = isTotal ? "row-total" : "tracker-row";
            tableMarkup += `<tr class="${rowClass}">
                <td>${item.name}</td>
                <td id="view-id-${i}" class="view-val">${item.views.toLocaleString()}</td>
            </tr>`;
        });
        tableMarkup += `</tbody></table>`;
        document.getElementById('live-data-box').innerHTML = tableMarkup;
    }

    function tickViews() {
        localData.forEach((item, i) => {
            if (!item.name.toUpperCase().includes("GRAND TOTAL") && Math.random() > 0.4) {
                item.views += Math.floor(Math.random() * 5) + 1;
                const el = document.getElementById(`view-id-${i}`);
                if (el) el.innerText = item.views.toLocaleString();
            }
        });
    }

    initializeTracker();
</script>

</body>
</html>
