<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Rikash Gebeya | Live Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --fb-blue: #1877f2;
            --fb-blue-dark: #1464c7;
            --fb-blue-darker: #0e5fd1;
            --pure-white: #ffffff;
            --white-transparent: rgba(255, 255, 255, 0.15);
        }

        body {
            font-family: 'Lato', sans-serif;
            background-color: var(--fb-blue);
            color: var(--pure-white);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Ticker */
        .ticker-wrapper { background-color: var(--fb-blue-darker); overflow: hidden; padding: 12px 0; border-bottom: 1px solid var(--white-transparent); }
        .ticker-content { display: inline-block; animation: scrollTicker 25s linear infinite; white-space: nowrap; }
        .ticker-item { display: inline-block; margin: 0 30px; font-weight: 500; }
        @keyframes scrollTicker { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        /* Hero Layout */
        .hero-section {
            max-width: 1300px;
            margin: 2rem auto;
            display: flex;
            flex-wrap: wrap;
            background-color: var(--fb-blue-dark);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .hero-image { flex: 2; min-width: 320px; }
        .hero-image img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .hero-content { flex: 0.6; padding: 1.5rem; background-color: var(--fb-blue); min-width: 250px; font-size: 0.9rem; }
        
        /* Tracker Styling */
        .hero-tracker { flex: 0.7; padding: 1rem; background: #f0f2f5; min-width: 280px; display: flex; flex-direction: column; }
        .tracker-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; color: #111; }
        td { padding: 12px 10px; font-weight: 700; border-bottom: 1px solid rgba(0,0,0,0.05); }

        /* Colors */
        .row-total { background: #111 !important; color: #ffff00 !important; border-top: 3px solid var(--fb-blue); }
        .row-green { background-color: #009b3a; color: white !important; }
        .row-yellow { background-color: #ffff00; color: #111 !important; }
        .row-red { background-color: #ff0000; color: white !important; }

        /* Animation */
        .view-cell { text-align: right; display: block; transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .bump { transform: scale(1.25); color: #fff !important; text-shadow: 0 0 8px rgba(255,255,255,0.8); }
        .row-yellow .bump { color: #000 !important; text-shadow: none; }

        .live-status { text-align: center; color: #333; margin-top: 10px; font-weight: 900; font-size: 0.8rem; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        @media (max-width: 1100px) { .hero-section { flex-direction: column; } }
    </style>
</head>
<body>

<div class="ticker-wrapper">
    <div class="ticker-content">
        <span class="ticker-item">✨ ከ10,000 ብር በላይ ለሚሆኑ ትዕዛዞች ነፃ ማጓጓዣ ✨</span>
        <span class="ticker-item">🔥 በየሳምንቱ አዳዲስ ምርቶች🔥</span>
        <span class="ticker-item">🚚 በመላው ኢትዮጵያ ፈጣን አገልግሎት 🚚</span>
    </div>
</div>

<main>
    <div class="hero-section">
        <div class="hero-image"><img src="img-home.webp" alt="Store Front"></div>
        <div class="hero-content">
            <h2>Address</h2>
            <p>Djibouti street, A.A Ethiopia</p>
            <p><strong>Contact</strong><br>0972919293</p>
        </div>
        <div class="hero-tracker">
            <div class="tracker-card" id="tracker-host">
                <p style="padding: 20px; color: #666; text-align: center;">Syncing Data...</p>
            </div>
            <div class="live-status">● TEDDY AFRO LIVE VIEW COUNT</div>
        </div>
    </div>
</main>

<script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRiDyVmggeaqz_LdLPowRFuIbCkmBiSMm-VVpns4K4FEJNZ1qhekQBhqDRakZOguK66bB7S5MD-pTc/pub?gid=0&single=true&output=csv';
    let trackData = [];
    let totalRowIndex = -1;

    async function fetchData() {
        try {
            const res = await fetch(`${CSV_URL}&t=${Date.now()}`);
            const text = await res.text();
            const rows = text.split(/\r?\n/).filter(r => r.trim() !== "");
            
            trackData = rows.slice(1).map(row => {
                const cols = row.match(/(".*?"|[^,]+)(?=\s*,|\s*$)/g);
                return { 
                    name: cols[0].replace(/"/g, '').trim(), 
                    views: parseInt(cols[1].replace(/[",]/g, '')) || 0 
                };
            });

            // Find where the Grand Total is in your Sheet
            totalRowIndex = trackData.findIndex(item => item.name.toUpperCase().includes("GRAND TOTAL"));
            renderTable();
        } catch (e) { console.error(e); }
    }

    function renderTable() {
        let html = `<table><tbody>`;
        const flagColors = ["row-green", "row-yellow", "row-red"];
        trackData.forEach((t, i) => {
            const isTotal = i === totalRowIndex;
            const rowClass = isTotal ? "row-total" : flagColors[i % 3];
            html += `<tr class="${rowClass}">
                <td>${t.name}</td>
                <td style="text-align:right;"><span id="val-${i}" class="view-cell">${t.views.toLocaleString()}</span></td>
            </tr>`;
        });
        document.getElementById('tracker-host').innerHTML = html + `</tbody></table>`;
    }

    function simulateGrowth() {
        if (trackData.length === 0) return;
        
        trackData.forEach((item, idx) => {
            // Only update actual songs, not the Total row itself
            if (idx !== totalRowIndex && Math.random() > 0.4) {
                const add = Math.floor(Math.random() * 15) + 5;
                item.views += add;

                // ADD to the Grand Total row mathematically
                if (totalRowIndex !== -1) {
                    trackData[totalRowIndex].views += add;
                    triggerBump(totalRowIndex); // Animate Total
                }
                triggerBump(idx); // Animate Song
            }
        });
    }

    function triggerBump(idx) {
        const el = document.getElementById(`val-${idx}`);
        if (el) {
            el.innerText = trackData[idx].views.toLocaleString();
            el.classList.remove('bump');
            void el.offsetWidth;
            el.classList.add('bump');
            setTimeout(() => el.classList.remove('bump'), 400);
        }
    }

    fetchData().then(() => {
        setInterval(simulateGrowth, 3000); // Live updates
        setInterval(fetchData, 300000);   // Refresh from Google Sheet every 5 mins
    });
</script>
</body>
</html>
