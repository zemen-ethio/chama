<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="description" content="Rikash Gebeya - Your trusted store in Addis Ababa, Ethiopia">
    <meta name="author" content="Rikash Gebeya">
    <title>Rikash Gebeya | Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* ============================================
           Core Theme & Layout
           ============================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --fb-blue: #1877f2;
            --fb-blue-dark: #1464c7;
            --fb-blue-darker: #0e5fd1;
            --pure-white: #ffffff;
            --white-transparent: rgba(255, 255, 255, 0.15);
            --border-radius-md: 12px;
        }

        body {
            font-family: 'Lato', sans-serif;
            background-color: var(--fb-blue);
            color: var(--pure-white);
            line-height: 1.6;
        }

        .page-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* ---------- Hero Section Skeleton ---------- */
        .hero-section {
            display: flex;
            flex-direction: row;
            align-items: stretch;
            background-color: var(--fb-blue-dark);
            border-radius: var(--border-radius-md);
            overflow: hidden;
            margin-bottom: 2rem;
            min-height: 450px;
        }

        /* ---------- Home Image (Centered & 50% Reduced) ---------- */
        .hero-image {
            flex: 0 0 50%;
            max-width: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--fb-blue-dark);
        }

        .hero-image img { 
            width: 50%; /* Reduced by 0.5 from original size */
            height: auto; 
            object-fit: contain;
            display: block;
        }

        /* ---------- Address & Info Section ---------- */
        .hero-content {
            flex: 0 0 25%;
            padding: 2rem;
            background-color: var(--fb-blue);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .hero-content h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }

        /* ---------- Live Tracker Section ---------- */
        .hero-tracker { 
            flex: 0 0 25%;
            padding: 1rem; 
            background: #f0f2f5; 
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            background: white;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        .row-total { background-color: #ffd700; font-weight: bold; }

        /* Responsive Mobile Layout */
        @media (max-width: 768px) {
            .hero-section { flex-direction: column; }
            .hero-image, .hero-content, .hero-tracker { 
                flex: 0 0 100%; 
                max-width: 100%; 
            }
            .hero-image img { width: 70%; }
        }
    </style>
</head>
<body>

<main class="page-content">
    <div class="hero-section">
        <div class="hero-image">
            <img src="img-home.webp" alt="Featured Product">
        </div>

        <div class="hero-content">
            <h2>Our Location</h2>
            <p>Djibouti Street, 22<br>Addis Ababa, Ethiopia</p>
            <br>
            <p><strong>Hours:</strong><br>Mon-Sat: 9am - 7pm</p>
        </div>

        <div class="hero-tracker">
            <div id="counter-host">
                <p style="text-align:center; padding:20px;">Loading Tracker...</p>
            </div>
            <p style="font-size: 0.7rem; margin-top: 10px; font-weight: bold;">● LIVE VIEW STATISTICS</p>
        </div>
    </div>
</main>

<script>
    // Simplified Tracker Logic for Demo
    const trackData = [
        { name: "Teddy Afro - Demo", views: 1250430 },
        { name: "Grand Total", views: 1250430 }
    ];

    function renderTable() {
        let html = `<table><thead><tr><th>Title</th><th>Views</th></tr></thead><tbody>`;
        trackData.forEach((t, i) => {
            const isTotal = t.name.includes("Total");
            html += `<tr class="${isTotal ? 'row-total' : ''}">
                <td>${t.name}</td>
                <td style="text-align:right;">${t.views.toLocaleString()}</td>
            </tr>`;
        });
        html += `</tbody></table>`;
        document.getElementById('counter-host').innerHTML = html;
    }

    window.onload = renderTable;
</script>

</body>
</html>
