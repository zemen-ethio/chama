<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="description" content="Rikash Gebeya - Your trusted store in Addis Ababa, Ethiopia">
    <meta name="author" content="Rikash Gebeya">
    <title>Rikash Gebeya | Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* ============================================
           CORE THEME (Preserved from Original)
           ============================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --fb-blue: #1877f2;
            --fb-blue-dark: #1464c7;
            --fb-blue-darker: #0e5fd1;
            --pure-white: #ffffff;
            --white-transparent: rgba(255, 255, 255, 0.15);
        }

        body {
            font-family: 'Lato', sans-serif;
            background-color: var(--fb-blue);
            color: var(--pure-white);
            line-height: 1.4;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Ticker Banner */
        .ticker-wrapper { background-color: var(--fb-blue-darker); overflow: hidden; padding: 10px 0; border-bottom: 1px solid var(--white-transparent); }
        .ticker-content { display: inline-block; animation: scrollTicker 30s linear infinite; white-space: nowrap; }
        .ticker-item { display: inline-block; margin: 0 25px; font-size: 0.9rem; font-weight: 500; }
        @keyframes scrollTicker { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        /* Header */
        .header { background-color: var(--fb-blue-dark); position: sticky; top: 0; z-index: 1000; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        .header-container { max-width: 1200px; margin: 0 auto; padding: 0.8rem 2rem; display: flex; align-items: center; justify-content: space-between; }
        .nav-menu { display: flex; list-style: none; gap: 5px; }
        .nav-menu li a { padding: 8px 15px; text-decoration: none; color: white; border-radius: 6px; font-size: 0.9rem; }
        .nav-menu li.active a { background-color: var(--white-transparent); }

        /* ============================================
           HERO SECTION - PROPORTIONAL ADJUSTMENTS
           ============================================ */
        .page-content { max-width: 1300px; margin: 0 auto; padding: 1.5rem; }
        .hero-section {
            display: flex;
            flex-wrap: wrap;
            background-color: var(--fb-blue-dark);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        /* BIGGER IMAGE: Taking 65% of the width */
        .hero-image { flex: 2; min-width: 320px; border-right: 1px solid var(--white-transparent); }
        .hero-image img { width: 100%; height: 100%; object-fit: cover; display: block; }

        /* SMALLER CONTENT & TRACKER: Taking 35% of the width */
        .hero-content { 
            flex: 1; 
            padding: 1.5rem; 
            background-color: var(--fb-blue); 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            min-width: 280px; 
        }

        .address-info { font-size: 0.85rem; }
        .address-info h2 { font-size: 1.3rem; margin-bottom: 8px; }
        .divider { height: 1px; background: var(--white-transparent); margin: 8px 0; }

        /* SMALLER TRACKER BOX */
        .tracker-box { background: rgba(0,0,0,0.1); padding: 8px; border-radius: 8px; }
        .table-wrap { background: white; border-radius: 6px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; font-size: 0.65rem; color: #333; }
        td { padding: 6px 8px; font-weight: 700; border-bottom: 1px solid #eee; }

        /* Flag Row Theme (Green-Yellow-Red) */
        .row-green { background-color: #009b3a; color: white !important; }
        .row-yellow { background-color: #ffff00; color: #111 !important; }
        .row-red { background-color: #ff0000; color: white !important; }
        .row-total { background: #111 !important; color: #ffff00 !important; font-size: 0.75rem; }
        .view-val { text-align: right; font-weight: 900; font-family: Arial, sans-serif; }

        .live-label { text-align: center; margin-top: 8px; font-size: 0.65rem; font-weight: 900; color: white; animation: blink 2s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        @media (max-width: 900px) { .hero-section { flex-direction: column; } .hero-image { flex: none; height: 350px; } }
    </style>
</head>
<body>

<div class="ticker-wrapper">
    <div class="ticker-content">
        <span class="ticker-item">✨ ከ10,000 ብር በላይ ለሚሆኑ ትዕዛዞች ነፃ ማጓጓዣ ✨</span>
        <span class="ticker-item">🔥 በየሳምንቱ አዳዲስ ምርቶች🔥</span>
        <span class="ticker-item">🚚 በመላው ኢትዮጵያ ፈጣን አገልግሎት 🚚</span>
    </div>
</div>

<header class="header">
    <div class="header-container">
        <div class="brand">
            <img src="img-logo.webp" alt="Logo" style="height: 45px; width: auto;">
            <span style="font-size: 1.2rem; font-weight: 700; margin-left: 8px;">Rikash Gebeya</span>
        </div>
        <ul class="nav-menu">
            <li class="active"><a href="index.html">Home</a></li>
            <li><a href="shop.html">Shop</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </div>
</header>

<main class="page-content">
    <div class="hero-section">
        <div class="hero-image">
            <img src="img-home.webp" alt="Rikash Gebeya Main View">
        </div>

        <div class="hero-content">
            <div class="address-info">
                <h2>Address</h2>
                <p>Djibouti street, Town Square Mall<br>Addis Ababa, Ethiopia</p>
                <div class="divider"></div>
                <p><strong>Hours:</strong> Mon-Fri 9am-6pm / Sat 10am-4pm</p>
                <p><strong>Tel:</strong> 0972919293 / 0967919293</p>
            </div>

            <div class="tracker-box">
                <div class="table-wrap" id="live-feed">
                    <p style="padding: 15px; text-align: center; color: #999; font-size: 0.6rem;">Connecting...</p>
                </div>
                <div class="live-label">● LIVE FEED</div>
            </div>
        </div>
    </div>
</main>

<script>
    const FEED_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRiDyVmggeaqz_LdLPvowRFuIbCkmBiSMm-VVpns4K4FEJNZ1qhekQBhqDRakZOguK66bB7S5MD-pTc/pub?gid=0&single=true&output=csv';
    let dataSet = [];

    async function startFeed() {
        try {
            const response = await fetch(FEED_URL);
            const raw = await response.text();
            const lines = raw.split(/\r?\n/).filter(l => l.trim() !== "");
            
            dataSet = lines.slice(1).map(line => {
                const parts = line.match(/(".*?"|[^,]+)(?=\s*,|\s*$)/g);
                if (parts && parts.length >= 2) {
                    return { 
                        title: parts[0].replace(/"/g, '').trim(), 
                        hits: parseInt(parts[1].replace(/[",]/g, '')) || 0 
                    };
                }
                return null;
            }).filter(d => d !== null);

            drawTable();
            setInterval(updateHits, 2500);
        } catch (err) {
            document.getElementById('live-feed').innerHTML = "<p style='padding:10px; color:red; text-align:center;'>Feed Error.</p>";
        }
    }

    function drawTable() {
        let html = `<table><tbody>`;
        const flagColors = ["row-green", "row-yellow", "row-red"];
        
        dataSet.forEach((item, idx) => {
            const isGrand = item.title.toUpperCase().includes("GRAND TOTAL");
            const rowStyle = isGrand ? "row-total" : flagColors[idx % 3];
            html += `<tr class="${rowStyle}">
                <td style="width: 70%;">${item.title}</td>
                <td id="count-${idx}" class="view-val">${item.hits.toLocaleString()}</td>
            </tr>`;
        });
        html += `</tbody></table>`;
        document.getElementById('live-feed').innerHTML = html;
    }

    function updateHits() {
        dataSet.forEach((item, idx) => {
            if (!item.title.toUpperCase().includes("GRAND TOTAL") && Math.random() > 0.5) {
                item.hits += Math.floor(Math.random() * 7) + 1;
                const cell = document.getElementById(`count-${idx}`);
                if (cell) cell.innerText = item.hits.toLocaleString();
            }
        });
    }

    startFeed();
</script>

</body>
</html>
