<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="description" content="Secure and flexible payment options at Rikash Gebeya">
    <meta name="author" content="Rikash Gebeya">
    <title>Rikash Gebeya | Payment</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { 
            --fb-blue: #1877f2; 
            --fb-blue-dark: #1464c7; 
            --fb-blue-darker: #0e5fd1; 
            --pure-white: #ffffff; 
            --white-transparent: rgba(255, 255, 255, 0.15);
        }
        body { font-family: 'Lato', sans-serif; background-color: var(--fb-blue); color: var(--pure-white); line-height: 1.6; }

        .ticker-wrapper { 
            background-color: var(--fb-blue-darker); 
            overflow: hidden; 
            white-space: nowrap; 
            padding: 12px 0; 
            border-bottom: 1px solid var(--white-transparent); 
            position: relative; 
            z-index: 100; 
        }
        .ticker-content { display: inline-block; animation: scrollTicker 25s linear infinite; }
        .ticker-item { display: inline-block; margin: 0 30px; font-size: 1rem; }
        @keyframes scrollTicker { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        .header { background-color: var(--fb-blue-dark); border-bottom: 1px solid var(--white-transparent); position: sticky; top: 0; z-index: 1000; }
        .header-container { max-width: 1200px; margin: 0 auto; padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; }
        .brand { display: flex; align-items: center; gap: 1rem; text-decoration: none; }
        .logo { width: 55px; height: 55px; filter: brightness(0) invert(1); }
        .brand-name { font-size: 1.5rem; font-weight: 700; font-family: 'Merriweather', serif; color: var(--pure-white); }
        .nav-menu { display: flex; list-style: none; gap: 0.25rem; }
        .nav-menu li a { padding: 0.6rem 1.2rem; text-decoration: none; color: var(--pure-white); border-radius: 8px; font-weight: 500; }
        .nav-menu li.active a { background-color: var(--white-transparent); opacity: 1; }
        .mobile-toggle { display: none; font-size: 1.8rem; background: none; border: none; color: white; cursor: pointer; }

        .page-content { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        .hero-section { background-color: var(--fb-blue-dark); text-align: center; padding: 3rem 2rem; border-radius: 12px; margin-bottom: 3rem; }
        .split-section { display: flex; flex-wrap: wrap; gap: 2rem; background-color: var(--fb-blue-dark); border-radius: 12px; overflow: hidden; }
        .split-image { flex: 1; min-width: 280px; }
        .split-image img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0.9; }
        .split-content { flex: 1; padding: 2.5rem; }

        .dropdown-container { display: flex; flex-direction: column; gap: 0.5rem; text-align: left; }
        .dropdown-container label { font-weight: bold; font-size: 1rem; color: var(--pure-white); }
        .payment-select { 
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--white-transparent); 
            background-color: var(--fb-blue-darker); color: white; font-size: 1rem; cursor: pointer; appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'%3E%3Cpath d='M7 10l5 5 5-5z'/%3E%3C/svg%3E");
            background-repeat: no-repeat; background-position: right 10px center; background-size: 20px;
        }
        .payment-select optgroup { background-color: var(--fb-blue-dark); color: #ffd700; font-weight: bold; }

        #payment-btn-container { display: none; margin-top: 2rem; text-align: center; }
        #unified-pay-btn { background-color: #ffd700; color: #0e5fd1; padding: 15px 30px; border: none; border-radius: 8px; font-weight: bold; font-size: 1.1rem; cursor: pointer; width: 100%; }

        .footer { background-color: var(--fb-blue-dark); padding: 2rem; text-align: center; margin-top: 3rem; border-top: 1px solid var(--white-transparent); }

        @media (max-width: 768px) {
            .mobile-toggle { display: block; }
            .nav-menu { display: none; width: 100%; flex-direction: column; background: var(--fb-blue-dark); padding: 1rem 0; }
            .nav-menu.active { display: flex; }
            .split-section { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="ticker-wrapper">
    <div class="ticker-content">
        <span class="ticker-item">✨ ከ10,000 ብር በላይ ለሚሆኑ ትዕዛዞች ነፃ ማጓጓዣ ✨</span>
        <span class="ticker-item">🚚 በመላው ኢትዮጵያ ፈጣን አገልግሎት 🚚</span>
    </div>
</div>

<header class="header">
    <div class="header-container">
        <div class="brand">
            <img class="logo" src="img-logo.png" alt="Logo">
            <span class="brand-name">Rikash Gebeya</span>
        </div>
        <button class="mobile-toggle" id="mobileMenuToggle">☰</button>
        <ul class="nav-menu" id="navMenu">
            <li><a href="index.html">Home</a></li>
            <li class="active"><a href="payment.html">Payment</a></li>
        </ul>
    </div>
</header>

<main class="page-content">
    <div class="hero-section">
        <h1>Secure Payment Options</h1>
    </div>

    <div class="split-section">
        <div class="split-image">
            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 500'%3E%3Crect width='600' height='500' fill='%230e5fd1'/%3E%3Ctext x='300' y='260' fill='white' text-anchor='middle'%3ECheckout%3C/text%3E%3C/svg%3E" alt="Checkout">
        </div>
        
        <div class="split-content">
            <div class="dropdown-container">
                <label for="global-gateways">🌐 Global Gateways</label>
                <select id="global-gateways" class="payment-select payment-trigger">
                    <option value="" disabled selected>Select Gateway</option>
                    <option value="stripe">Stripe</option>
                    <option value="paypal">PayPal</option>
                </select>
            </div>

            <div class="dropdown-container" style="margin-top: 1.5rem;">
                <label for="local-payments">🇪🇹 Local Payments</label>
                <select id="local-payments" class="payment-select payment-trigger">
                    <option value="" disabled selected>Select Local Bank/Gateway</option>
                    <optgroup label="Gateways">
                        <option value="chapa">Chapa (Telebirr, CBE Birr, Banks)</option>
                        <option value="telebirr">Telebirr</option>
                        <option value="mpesa">M-PESA</option>
                    </optgroup>
                    <optgroup label="Banks">
                        <option value="cbe">CBE</option>
                        <option value="awash">Awash Bank</option>
                        <option value="dashen">Dashen Bank</option>
                        <option value="abyssinia">Bank of Abyssinia</option>
                    </optgroup>
                </select>
            </div>

            <div id="payment-btn-container">
                <button id="unified-pay-btn">Proceed to Payment</button>
            </div>
        </div>
    </div>
</main>

<script>
    const gSelect = document.getElementById('global-gateways');
    const lSelect = document.getElementById('local-payments');
    const btnCont = document.getElementById('payment-btn-container');
    const payBtn = document.getElementById('unified-pay-btn');
    let selectedMethod = "";

    function handleSelection(target) {
        selectedMethod = target.value;
        if (selectedMethod) {
            if (target.id === 'global-gateways') lSelect.selectedIndex = 0;
            else gSelect.selectedIndex = 0;
            btnCont.style.display = 'block';
            payBtn.innerText = `Pay Now with ${selectedMethod.toUpperCase()}`;
        }
    }

    gSelect.addEventListener('change', (e) => handleSelection(e.target));
    lSelect.addEventListener('change', (e) => handleSelection(e.target));

    [gSelect, lSelect].forEach(s => {
        s.addEventListener('keypress', (e) => { if(e.key === 'Enter') handleSelection(e.target); });
    });

    payBtn.addEventListener('click', async () => {
        payBtn.disabled = true;
        payBtn.innerText = "Processing...";
        if (selectedMethod === 'chapa') {
            if (typeof startCheckout === "function") {
                await startCheckout("150.00", "customer@rikashgebeya.com", "Valued Guest");
            } else {
                alert("Loading system...");
            }
        } else {
            window.location.href = `receipt.html?method=${selectedMethod}`;
        }
    });

    document.getElementById('mobileMenuToggle').addEventListener('click', () => {
        document.getElementById('navMenu').classList.toggle('active');
    });
</script>
<script src="main.js"></script>
</body>
</html>
